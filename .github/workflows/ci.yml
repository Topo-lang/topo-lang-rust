name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the upstream refs this build is tested against.
  # Bump whenever a new compatible tag ships.
  TOPO_CORE_REF: main
  TOPO_LANG_REF: main
  TOPO_LANG_CPP_REF: main
  TOPO_LLVM_REF: main
  TOPO_CLI_REF: main

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Matches the `builtin-baseline` pinned in vcpkg.json. Bump both
          # together when refreshing the vcpkg snapshot.
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      # Cache the upstream Topo install (topo-core + topo-lang) so PRs
      # don't re-build them every time. Keyed on the two pinned refs so
      # bumping invalidates the cache.
      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          key: topo-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-${{ matrix.os }}-v1

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      # Re-install topo-core to flip TOPO_CORE_WITH_LANG ON now that
      # topo-lang is discoverable in the prefix. This wires lib/Build +
      # lib/Transpile into the topo-core install set, which downstream
      # consumers (including topo-lang-rust) need.
      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Configure topo-lang-rust
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LANG_RUST_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      # Smoke test: install topo-lang-rust, then verify a downstream
      # find_package(topo-lang-rust CONFIG REQUIRED) resolves and links the
      # topo::lang-rust::TopoRustPlugin aggregator from the zero-LLVM
      # install, and that the plugin registers + resolves at runtime.
      - name: Install topo-lang-rust
        run: cmake --install build --prefix "${RUNNER_TEMP}/lang-rust-install"

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          cat > vcpkg.json <<'JSON'
          {
            "name": "topo-lang-rust-smoke",
            "version-string": "0.0.1",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(lang-rust-find-package-smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(topo-lang-rust CONFIG REQUIRED)
          add_executable(smoke smoke.cpp)
          target_link_libraries(smoke PRIVATE topo::lang-rust::TopoRustPlugin)
          CMAKE
          cat > smoke.cpp <<'CPP'
          // Linking topo::lang-rust::TopoRustPlugin pulls the full zero-LLVM
          // aggregator closure (TopoRustInit/Analysis/Check/Transpile/LSP +
          // topo::lang::TopoLang + topo::core::* via PUBLIC propagation).
          // The runtime probe asserts the installed plugin actually
          // registers and resolves — the per-repo acceptance check that the
          // default install set answers rust.
          #include <RustPlugin.h>
          #include "stub/RustStubGenerator.h"
          #include <cstdio>
          #include <string>
          int main() {
              const std::string src = "fn add(a: i32, b: i32) -> i32 { a + b }\n";
              const size_t pos = topo::check::RustStubGenerator::findFunctionBodyStart(src, "add");
              if (pos == std::string::npos || src[pos] != '{') return 1;
              topo::lang::registerRustPlugin();
              if (topo::lang::getPlugin(topo::HostLanguage::Rust) == nullptr) return 1;
              std::printf("topo-lang-rust find_package OK: body opens at %zu; Rust plugin registered\n", pos);
              return 0;
          }
          CPP
          cmake -S . -B build -G Ninja \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/lang-rust-install;${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          # bash does not resolve the .exe suffix for exec — the Windows
          # runner builds smoke.exe, every other leg builds smoke. The
          # MinGW-linked smoke.exe also needs its build-time gcc bin dir
          # FIRST on PATH to resolve libstdc++/libgcc at exec time (the
          # same fix the Test step uses) — a missing DLL surfaces as
          # bash exit 127.
          if [ "" = "Windows" ]; then
            cxx=20 20 12 61 79 80 81 33 98 100 204 250 395 398 399 400 701grep -m1 '^CMAKE_CXX_COMPILER:' build/CMakeCache.txt | cut -d= -f2)
            if [ -n "" ]; then
              export PATH="20 20 12 61 79 80 81 33 98 100 204 250 395 398 399 400 701cygpath -u "20 20 12 61 79 80 81 33 98 100 204 250 395 398 399 400 701dirname "")"):"
            fi
            ./build/smoke.exe
          else
            ./build/smoke
          fi

  # ── ENABLE_LLVM=ON verify: topo-debug-rust relocatable install ──────────
  # build-and-test (above) covers only the zero-LLVM scope, so topo-debug-rust
  # (liblldb-linked, gated behind TOPO_LANG_RUST_ENABLE_LLVM) is never built by
  # THIS repo's CI otherwise — its runtime e2e lives in topo-llvm's benchmark
  # job. This job owns the macOS relocatable-install gate for the adapter: the
  # installed binary must load liblldb via @rpath (not the build host's
  # absolute /opt/homebrew/... path), carry no versioned Cellar LLVM rpath,
  # and still run with the build-host rpaths stripped and the liblldb closure
  # bundled under ../lib. macOS-only: the load-command rewrite is Mach-O
  # surgery; ELF resolves the soname through the $ORIGIN runpath and is
  # exercised by topo-llvm's Linux jobs. Upstream chain mirrors topo-lang-cpp's
  # verify-llvm job (uncached; an upstream-install cache can be added later).
  verify-llvm:
    name: verify (ENABLE_LLVM) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v5

      # liblldb (topo-debug link), libclang (topo-lang-cpp's extractor build,
      # part of the lang-cpp ENABLE_LLVM install this job depends on).
      - name: Install build deps + LLVM (macos)
        run: brew install ninja llvm@22 rust rust-analyzer

      - name: Point find_package(LLVM/Clang) at brew llvm@22 (macos)
        run: |
          BREW_LLVM="$(brew --prefix llvm@22)"
          echo "LLVM_DIR=${BREW_LLVM}/lib/cmake/llvm"   >> "$GITHUB_ENV"
          echo "Clang_DIR=${BREW_LLVM}/lib/cmake/clang" >> "$GITHUB_ENV"
          echo "${BREW_LLVM}/bin" >> "$GITHUB_PATH"

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      # ── Bootstrap the upstream chain into a shared prefix ──
      - name: Build & install topo-core (zero-LLVM, lang-less)
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      # topo-llvm's C-ABI runtime libs #include topo-lang-cpp's runtime
      # headers, so lang-cpp installs at DEFAULT scope (LLVM-independent)
      # before the topo-llvm core build. Mirrors topo-lang-cpp's verify job.
      - name: Build & install topo-lang-cpp (default scope — runtime headers)
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_CPP_REF}" \
              https://github.com/topo-lang/topo-lang-cpp.git "${RUNNER_TEMP}/topo-lang-cpp-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" -B "${RUNNER_TEMP}/lang-cpp-default-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_CPP_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/lang-cpp-default-build" --target install

      - name: Build & install topo-llvm core (tools OFF)
        run: |
          git clone --depth 1 --branch "${TOPO_LLVM_REF}" \
              https://github.com/topo-lang/topo-llvm.git "${RUNNER_TEMP}/topo-llvm-src"
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S "${RUNNER_TEMP}/topo-llvm-src" -B "${RUNNER_TEMP}/llvm-core-build" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${LLVM_ROOT}" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LLVM_BUILD_TOOLS=OFF -DTOPO_LLVM_BUILD_TESTS=OFF \
                -DTOPO_LLVM_BUILD_JIT_ENGINE=ON
          cmake --build "${RUNNER_TEMP}/llvm-core-build" --target install

      # Provides the exported topo::lang-cpp::TopoDebugAdapter archive that
      # topo-debug-rust force-loads (adapter.cpp is host-language-agnostic).
      - name: Build & install topo-lang-cpp (ENABLE_LLVM=ON)
        run: |
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" -B "${RUNNER_TEMP}/lang-cpp-llvm-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${LLVM_ROOT}" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_CPP_ENABLE_LLVM=ON -DTOPO_LANG_CPP_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/lang-cpp-llvm-build" --target install

      # Uncached on purpose: topo-cli is a thin router + small static lib,
      # and an always-fresh build tracks its main without a cache key to
      # bump. Plugins auto-detect to OFF (none on this prefix) — the
      # checker-e2e suite links only the TopoCheckRunner static lib and
      # registers this repo's plugin itself via TestMain. Profile CLI off:
      # it would pull topo-v8 into the installed config's find_dependency
      # chain.
      - name: Build & install topo-cli (TopoCheckRunner export)
        run: |
          git clone --depth 1 --branch "${TOPO_CLI_REF}" \
              https://github.com/topo-lang/topo-cli.git "${RUNNER_TEMP}/topo-cli-src"
          cmake -S "${RUNNER_TEMP}/topo-cli-src" -B "${RUNNER_TEMP}/topo-cli-build" \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-cli-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_CLI_ENABLE_PROFILE=OFF
          cmake --build "${RUNNER_TEMP}/topo-cli-build" --target install

      # ── Configure THIS checkout with the LLVM gate ON; build only the
      #    adapter (skips the cargo extractor + driver targets) ──
      - name: Configure topo-lang-rust (ENABLE_LLVM=ON)
        run: |
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DTOPO_LANG_RUST_ENABLE_LLVM=ON \
              -DTOPO_LANG_RUST_BUILD_TESTS=ON \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${RUNNER_TEMP}/topo-cli-install;${LLVM_ROOT}" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

      - name: Build topo-debug-rust
        run: cmake --build build --target topo-debug-rust

      - name: Build checker-e2e suite
        run: cmake --build build --target topo-lang-rust-check-tests

      # Relocatable-install gate — mirrors topo-lang-cpp's topo-debug-cpp gate.
      # brew's liblldb has a VERSIONED basename (liblldb.22.1.7.dylib), so the
      # bundle uses the exact name the rewritten load command records; liblldb
      # itself then pulls @rpath/libLLVM + @rpath/libclang-cpp through its own
      # embedded @loader_path/../lib rpath, so the closure bundles those two
      # as well.
      - name: Verify relocatable topo-debug-rust (@rpath liblldb) (macos)
        run: |
          set -euo pipefail
          PREFIX="${RUNNER_TEMP}/debug-reloc"
          cmake -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -P build/topo-debug/cmake_install.cmake
          BIN="$PREFIX/bin/topo-debug-rust"
          echo "::group::otool -L $BIN"; otool -L "$BIN"; echo "::endgroup::"
          if otool -L "$BIN" | grep -E '^[[:space:]]+/.*/liblldb[^ ]*\.dylib'; then
            echo "FAIL: installed topo-debug-rust still loads liblldb by absolute path"; exit 1
          fi
          otool -L "$BIN" | grep -qE '@rpath/liblldb[^ ]*\.dylib' \
            || { echo "FAIL: no @rpath/liblldb load command"; exit 1; }
          # No exact-patch Homebrew keg may survive as an rpath — the install
          # step rewrites …/Cellar/llvm*/<ver>/lib to the stable opt form.
          if otool -l "$BIN" | grep -E 'path .*/Cellar/llvm[^/]*/[0-9]'; then
            echo "FAIL: installed topo-debug-rust still carries a versioned Cellar LLVM rpath"; exit 1
          fi
          mkdir -p "$PREFIX/lib"
          LLDB_NAME="$(otool -L "$BIN" | sed -n 's|^[[:space:]]*@rpath/\(liblldb[^ ]*\.dylib\).*|\1|p' | head -1)"
          cp -L "$(brew --prefix llvm@22)/lib/$LLDB_NAME"         "$PREFIX/lib/$LLDB_NAME"
          cp -L "$(brew --prefix llvm@22)/lib/libLLVM.dylib"      "$PREFIX/lib/"
          cp -L "$(brew --prefix llvm@22)/lib/libclang-cpp.dylib" "$PREFIX/lib/"
          for rp in $(otool -l "$BIN" | awk '/LC_RPATH/{f=1} f&&/ path /{print $2; f=0}'); do
            case "$rp" in @loader_path*) ;; *) install_name_tool -delete_rpath "$rp" "$BIN" || true ;; esac
          done
          echo "rpaths after stripping build-host entries:"
          otool -l "$BIN" | awk '/LC_RPATH/{f=1} f&&/ path /{print "  "$2; f=0}'
          # No args + </dev/null: the adapter exits on usage error / stdin EOF,
          # so the spawn is gated purely on surviving dyld (rc<128, no
          # 'Library not loaded'), not on protocol behavior.
          set +e
          out="$(DYLD_PRINT_LIBRARIES=1 "$BIN" </dev/null 2>&1)"; rc=$?
          set -e
          grep -iE '/lib/liblldb[^ ]*\.dylib' <<<"$out" | head -1 || true
          if grep -qiE 'Library not loaded|image not found|Symbol not found' <<<"$out"; then
            echo "FAIL: dyld could not resolve a dependency from the bundled @loader_path/../lib"; exit 1
          fi
          if [ "$rc" -ge 128 ]; then
            echo "FAIL: relocated topo-debug-rust died from signal (rc=$rc) — dyld load failure"; exit 1
          fi
          WANT="$(cd "$PREFIX/lib" && pwd -P)"
          grep -qF "$WANT/$LLDB_NAME" <<<"$out" \
            || { echo "FAIL: liblldb not loaded from the bundled ../lib ($WANT)"; exit 1; }
          echo "PASS: topo-debug-rust relocates — runs (rc=$rc) loading bundled liblldb via @loader_path/../lib"

      - name: Run checker-e2e suite
        run: |
          # --no-tests=error: if the topo-cli gate silently failed and the
          # checker suite was never registered, the job FAILS rather than
          # greening on zero tests.
          ctest --test-dir build -L checker --output-on-failure --timeout 180 --no-tests=error

      # The checker suite passes ctest even when its gtest cases
      # GTEST_SKIP() (rust-analyzer absent / fixture extraction degraded) —
      # "Passed" can mean "every case skipped". Re-run the binary via the
      # shared assert script: strict mode keeps the aggregate guards
      # (exit 0, >=1 pass, ZERO skips), and the NAMED anchor cases — one
      # per rust-analyzer-gated suite — must additionally appear in the
      # PASSED set. An ABSENT name means renamed / filtered / not compiled
      # in; update the list together with the test, never weaken the
      # pattern.
      - name: Assert L2 deep containment ran (skip != pass)
        run: |
          bash .github/scripts/assert-live-cases.sh strict topo-lang-rust-check-tests \
            RustContainmentL2.ContainmentL2ExternalOk \
            RustCompleteness.CompletenessPassFixture \
            RustContainment.ContainmentRustFail
